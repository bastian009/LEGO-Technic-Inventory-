<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Technic Inventory Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lego: {
                            yellow: '#f6d700',
                            red: '#ce181e',
                            blue: '#0055bf',
                            dark: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (Development links for immediate compilation) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Icons (Lucide via external SVG wrapper component) -->
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Spinner animation */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Utility Components ---
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
                trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
                search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
                download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
                cube: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            };
            return (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    {icons[name] || icons.cube}
                    {name === 'settings' && <circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth={2} />}
                </svg>
            );
        };

        const Loader = () => (
            <div className="flex flex-col items-center justify-center p-8 space-y-4">
                <div className="w-12 h-12 border-4 border-lego-blue border-t-lego-yellow rounded-full spinner"></div>
                <p className="text-slate-400 font-medium">Fetching Data from Rebrickable...</p>
            </div>
        );

        // --- Core Application ---
        const App = () => {
            // State
            const [apiKey, setApiKey] = useState(localStorage.getItem('rebrickableKey') || '');
            const [sets, setSets] = useState(JSON.parse(localStorage.getItem('legoSets')) || []);
            const [activeTab, setActiveTab] = useState('inventory');
            
            // UI State
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [newSetNum, setNewSetNum] = useState('');
            const [selectedPart, setSelectedPart] = useState(null);

            // Save to local storage on change
            useEffect(() => {
                localStorage.setItem('rebrickableKey', apiKey);
            }, [apiKey]);

            useEffect(() => {
                localStorage.setItem('legoSets', JSON.stringify(sets));
            }, [sets]);

            // --- API Functions ---
            const formatSetNum = (num) => num.includes('-') ? num : `${num}-1`;

            const fetchFromApi = async (url) => {
                if (!apiKey) throw new Error("API Key is missing.");
                const res = await fetch(url, { headers: { 'Authorization': `key ${apiKey}` } });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({ detail: res.statusText }));
                    throw new Error(errData.detail || `HTTP Error ${res.status}`);
                }
                return res.json();
            };

            const handleAddSet = async (e) => {
                e.preventDefault();
                if (!newSetNum.trim()) return;
                
                const formattedNum = formatSetNum(newSetNum.trim());
                if (sets.some(s => s.set_num === formattedNum)) {
                    setErrorMsg("Set already exists in collection.");
                    return;
                }

                setLoading(true);
                setErrorMsg('');
                try {
                    // Fetch Set Details
                    const setData = await fetchFromApi(`https://rebrickable.com/api/v3/lego/sets/${formattedNum}/`);
                    
                    // Fetch Parts (Handle Pagination)
                    let parts = [];
                    let partsUrl = `https://rebrickable.com/api/v3/lego/sets/${formattedNum}/parts/?page_size=1000`;
                    
                    while (partsUrl) {
                        const partsData = await fetchFromApi(partsUrl);
                        parts = parts.concat(partsData.results);
                        partsUrl = partsData.next; // will be null when done
                    }

                    const newSet = { ...setData, parts };
                    setSets([...sets, newSet]);
                    setNewSetNum('');
                    setActiveTab('inventory');
                } catch (err) {
                    setErrorMsg(`Failed to add set: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const removeSet = (setNum) => {
                setSets(sets.filter(s => s.set_num !== setNum));
            };

            // --- Consolidation Logic ---
            const inventory = useMemo(() => {
                const map = {};
                sets.forEach(set => {
                    if (!set.parts) return;
                    set.parts.forEach(p => {
                        const partNum = p.part.part_num;
                        const colorId = p.color.id;
                        const key = `${partNum}_${colorId}`;
                        
                        if (!map[key]) {
                            map[key] = {
                                id: key,
                                part_num: partNum,
                                name: p.part.name,
                                color_id: colorId,
                                color_name: p.color.name,
                                img_url: p.part.part_img_url || `https://placehold.co/150x150/1e293b/94a3b8?text=${partNum}`,
                                total_qty: 0,
                                element_id: p.element_id,
                                provenance: []
                            };
                        }
                        
                        map[key].total_qty += p.quantity;
                        
                        // Check if set already in provenance, if so, add qty (rare but handles duplicate part entries in API if any)
                        const existingProv = map[key].provenance.find(prov => prov.set_num === set.set_num);
                        if (existingProv) {
                            existingProv.qty += p.quantity;
                        } else {
                            map[key].provenance.push({
                                set_num: set.set_num,
                                name: set.name,
                                qty: p.quantity
                            });
                        }
                    });
                });
                return Object.values(map);
            }, [sets]);

            const uniqueColors = useMemo(() => {
                const colors = new Set();
                inventory.forEach(item => colors.add(item.color_name));
                return Array.from(colors).sort();
            }, [inventory]);

            // --- Inventory View Components ---
            const InventoryView = () => {
                const [search, setSearch] = useState('');
                const [colorFilter, setColorFilter] = useState('');
                const [sortBy, setSortBy] = useState('qty_desc');

                const filteredInventory = useMemo(() => {
                    let result = inventory.filter(item => {
                        const matchesSearch = item.name.toLowerCase().includes(search.toLowerCase()) || 
                                              item.part_num.toLowerCase().includes(search.toLowerCase());
                        const matchesColor = colorFilter === '' || item.color_name === colorFilter;
                        return matchesSearch && matchesColor;
                    });

                    result.sort((a, b) => {
                        if (sortBy === 'qty_desc') return b.total_qty - a.total_qty;
                        if (sortBy === 'qty_asc') return a.total_qty - b.total_qty;
                        if (sortBy === 'name_asc') return a.name.localeCompare(b.name);
                        if (sortBy === 'name_desc') return b.name.localeCompare(a.name);
                        return 0;
                    });

                    return result;
                }, [search, colorFilter, sortBy, inventory]);

                const totalPhysicalParts = inventory.reduce((sum, item) => sum + item.total_qty, 0);

                const exportCSV = () => {
                    const headers = ['Part Number', 'Name', 'Color', 'Total Quantity'];
                    const rows = inventory.map(i => `"${i.part_num}","${i.name}","${i.color_name}",${i.total_qty}`);
                    const csvContent = [headers.join(','), ...rows].join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'lego_inventory.csv';
                    a.click();
                };

                const exportJSON = () => {
                    const blob = new Blob([JSON.stringify(inventory, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'lego_inventory.json';
                    a.click();
                };

                if (sets.length === 0) {
                    return (
                        <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                            <Icon name="cube" className="w-16 h-16 mb-4 opacity-50" />
                            <h2 className="text-xl font-bold text-slate-200">No Sets in Collection</h2>
                            <p className="mt-2">Go to the "Collection" tab to add your first set (e.g., 42096).</p>
                        </div>
                    );
                }

                return (
                    <div className="space-y-6">
                        {/* Controls */}
                        <div className="bg-slate-800 p-4 rounded-xl shadow-md flex flex-wrap gap-4 items-end justify-between border border-slate-700">
                            <div className="flex flex-wrap gap-4 flex-grow">
                                <div className="flex-grow max-w-sm relative">
                                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 block">Search Parts</label>
                                    <Icon name="search" className="w-5 h-5 absolute left-3 top-8 text-slate-500" />
                                    <input 
                                        type="text" 
                                        placeholder="Name or Part No."
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-lego-blue transition-colors"
                                        value={search}
                                        onChange={(e) => setSearch(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 block">Color Filter</label>
                                    <select 
                                        className="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-lego-blue"
                                        value={colorFilter}
                                        onChange={(e) => setColorFilter(e.target.value)}
                                    >
                                        <option value="">All Colors</option>
                                        {uniqueColors.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 block">Sort By</label>
                                    <select 
                                        className="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-lego-blue"
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                    >
                                        <option value="qty_desc">Quantity (High to Low)</option>
                                        <option value="qty_asc">Quantity (Low to High)</option>
                                        <option value="name_asc">Name (A-Z)</option>
                                        <option value="name_desc">Name (Z-A)</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="flex space-x-2">
                                <button onClick={exportCSV} className="flex items-center px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors">
                                    <Icon name="download" className="w-4 h-4 mr-2" /> CSV
                                </button>
                                <button onClick={exportJSON} className="flex items-center px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors">
                                    <Icon name="download" className="w-4 h-4 mr-2" /> JSON
                                </button>
                            </div>
                        </div>

                        {/* Stats */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col justify-center items-center">
                                <span className="text-sm text-slate-400">Total Sets</span>
                                <span className="text-2xl font-bold text-white">{sets.length}</span>
                            </div>
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col justify-center items-center">
                                <span className="text-sm text-slate-400">Unique Lots</span>
                                <span className="text-2xl font-bold text-white">{inventory.length}</span>
                            </div>
                            <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col justify-center items-center col-span-2 sm:col-span-2">
                                <span className="text-sm text-slate-400">Total Physical Pieces</span>
                                <span className="text-2xl font-bold text-lego-yellow">{totalPhysicalParts.toLocaleString()}</span>
                            </div>
                        </div>

                        {/* Grid */}
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                            {filteredInventory.map(part => (
                                <div key={part.id} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden flex flex-col hover:border-slate-500 transition-colors group cursor-pointer" onClick={() => setSelectedPart(part)}>
                                    <div className="bg-white p-2 relative h-36 flex items-center justify-center">
                                        <img 
                                            src={part.img_url} 
                                            alt={part.name}
                                            className="max-h-full max-w-full object-contain group-hover:scale-110 transition-transform"
                                            onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/150x150/1e293b/94a3b8?text=${part.part_num}` }}
                                        />
                                        <div className="absolute top-2 right-2 bg-lego-dark/80 text-white text-xs px-2 py-1 rounded shadow-sm backdrop-blur-sm font-bold border border-slate-600">
                                            x{part.total_qty}
                                        </div>
                                    </div>
                                    <div className="p-3 flex-grow flex flex-col">
                                        <div className="text-xs text-slate-400 font-mono mb-1">{part.part_num}</div>
                                        <div className="text-sm font-semibold leading-tight line-clamp-2 flex-grow" title={part.name}>{part.name}</div>
                                        <div className="text-xs text-slate-400 mt-2 flex justify-between items-center">
                                            <span>{part.color_name}</span>
                                            <span className="bg-slate-700 px-1.5 py-0.5 rounded-sm">{part.provenance.length} sets</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        {filteredInventory.length === 0 && (
                            <div className="text-center py-10 text-slate-500">No parts found matching your criteria.</div>
                        )}
                    </div>
                );
            };

            // --- Collection View ---
            const CollectionView = () => (
                <div className="space-y-6">
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                        <h2 className="text-xl font-bold mb-4">Add a Set to Collection</h2>
                        <form onSubmit={handleAddSet} className="flex flex-col sm:flex-row gap-4">
                            <input 
                                type="text"
                                placeholder="Enter Set Number (e.g. 42096)"
                                className="flex-grow bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-lego-blue text-lg"
                                value={newSetNum}
                                onChange={(e) => setNewSetNum(e.target.value)}
                                disabled={loading}
                            />
                            <button 
                                type="submit"
                                disabled={loading || !newSetNum.trim() || !apiKey}
                                className="bg-lego-blue hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center disabled:opacity-50"
                            >
                                {loading ? 'Fetching...' : <><Icon name="plus" className="w-5 h-5 mr-2"/> Add Set</>}
                            </button>
                        </form>
                        {!apiKey && <p className="text-red-400 mt-2 text-sm">Please set your Rebrickable API key in settings first.</p>}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {sets.map(set => (
                            <div key={set.set_num} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden flex shadow-lg relative">
                                <button 
                                    onClick={() => removeSet(set.set_num)}
                                    className="absolute top-2 right-2 bg-red-500/80 hover:bg-red-500 text-white p-1.5 rounded-md transition-colors z-10 backdrop-blur"
                                    title="Remove set"
                                >
                                    <Icon name="trash" className="w-4 h-4" />
                                </button>
                                <div className="w-1/3 bg-white p-2 flex items-center justify-center">
                                    <img src={set.set_img_url} alt={set.name} className="max-h-32 object-contain" />
                                </div>
                                <div className="w-2/3 p-4 flex flex-col justify-center">
                                    <div className="text-sm text-slate-400 font-mono">{set.set_num}</div>
                                    <h3 className="text-lg font-bold leading-tight mb-2">{set.name}</h3>
                                    <div className="flex gap-2 text-xs">
                                        <span className="bg-slate-700 px-2 py-1 rounded text-slate-300">{set.year}</span>
                                        <span className="bg-slate-700 px-2 py-1 rounded text-slate-300">{set.num_parts} parts</span>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // --- MOC Comparator View ---
            const MocView = () => {
                const [mocSetNum, setMocSetNum] = useState('');
                const [mocLoading, setMocLoading] = useState(false);
                const [mocData, setMocData] = useState(null);
                const [ignoreColors, setIgnoreColors] = useState(false);

                const handleFetchMoc = async (e) => {
                    e.preventDefault();
                    if (!mocSetNum.trim()) return;
                    setMocLoading(true);
                    setErrorMsg('');
                    try {
                        const formattedNum = formatSetNum(mocSetNum.trim());
                        const setData = await fetchFromApi(`https://rebrickable.com/api/v3/lego/sets/${formattedNum}/`);
                        
                        let parts = [];
                        let partsUrl = `https://rebrickable.com/api/v3/lego/sets/${formattedNum}/parts/?page_size=1000`;
                        
                        while (partsUrl) {
                            const partsData = await fetchFromApi(partsUrl);
                            parts = parts.concat(partsData.results);
                            partsUrl = partsData.next;
                        }
                        
                        setMocData({ set: setData, parts });
                    } catch (err) {
                        setErrorMsg(`Failed to fetch MOC data: ${err.message}`);
                    } finally {
                        setMocLoading(false);
                    }
                };

                const comparison = useMemo(() => {
                    if (!mocData) return null;
                    
                    const reqParts = {};
                    // Group MOC requirements
                    mocData.parts.forEach(p => {
                        const key = ignoreColors ? p.part.part_num : `${p.part.part_num}_${p.color.id}`;
                        if (!reqParts[key]) {
                            reqParts[key] = {
                                part_num: p.part.part_num,
                                name: p.part.name,
                                color_name: ignoreColors ? 'Any Color' : p.color.name,
                                img_url: p.part.part_img_url || `https://placehold.co/150/1e293b/94a3b8?text=${p.part.part_num}`,
                                required: 0,
                                available: 0
                            };
                        }
                        reqParts[key].required += p.quantity;
                    });

                    // Match against available inventory
                    inventory.forEach(inv => {
                        const exactKey = `${inv.part_num}_${inv.color_id}`;
                        const ignoreColorKey = inv.part_num;
                        
                        if (ignoreColors && reqParts[ignoreColorKey]) {
                            reqParts[ignoreColorKey].available += inv.total_qty;
                        } else if (!ignoreColors && reqParts[exactKey]) {
                            reqParts[exactKey].available += inv.total_qty;
                        }
                    });

                    let missingList = [];
                    let sufficientList = [];

                    Object.values(reqParts).forEach(p => {
                        p.missing = Math.max(0, p.required - p.available);
                        if (p.missing > 0) missingList.push(p);
                        else sufficientList.push(p);
                    });

                    // Sort by missing qty desc
                    missingList.sort((a, b) => b.missing - a.missing);

                    return { missingList, sufficientList };
                }, [mocData, inventory, ignoreColors]);

                return (
                    <div className="space-y-6">
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                            <h2 className="text-xl font-bold mb-2">Compare against a MOC</h2>
                            <p className="text-slate-400 text-sm mb-4">Enter a target Set number (acting as a MOC) to see if your consolidated inventory has the required parts.</p>
                            
                            <form onSubmit={handleFetchMoc} className="flex flex-col sm:flex-row gap-4 mb-4">
                                <input 
                                    type="text"
                                    placeholder="Enter Target Set No. (e.g. 42158)"
                                    className="flex-grow bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 focus:outline-none focus:border-lego-blue"
                                    value={mocSetNum}
                                    onChange={(e) => setMocSetNum(e.target.value)}
                                    disabled={mocLoading}
                                />
                                <button 
                                    type="submit"
                                    disabled={mocLoading || !mocSetNum.trim()}
                                    className="bg-lego-blue hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition-colors"
                                >
                                    {mocLoading ? 'Comparing...' : 'Compare'}
                                </button>
                            </form>
                            
                            <label className="flex items-center space-x-2 cursor-pointer select-none w-max">
                                <input 
                                    type="checkbox" 
                                    className="w-5 h-5 rounded border-slate-600 text-lego-blue focus:ring-lego-blue focus:ring-offset-slate-800 bg-slate-900"
                                    checked={ignoreColors}
                                    onChange={(e) => setIgnoreColors(e.target.checked)}
                                />
                                <span className="text-sm font-medium">Ignore Colors (match purely by design ID)</span>
                            </label>
                        </div>

                        {mocLoading && <Loader />}

                        {comparison && !mocLoading && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="flex items-center gap-4 border-b border-slate-700 pb-4">
                                    <img src={mocData.set.set_img_url} className="h-20 rounded" alt="MOC" />
                                    <div>
                                        <h3 className="text-2xl font-bold">{mocData.set.name}</h3>
                                        <p className="text-slate-400 text-sm">Comparison Results</p>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-xl font-bold text-red-400 mb-4 flex items-center">
                                        Missing Parts <span className="ml-2 bg-red-900/50 text-red-300 text-sm px-2 py-1 rounded-full">{comparison.missingList.length} Lots</span>
                                    </h3>
                                    {comparison.missingList.length === 0 ? (
                                        <div className="p-4 bg-green-900/20 text-green-400 rounded-xl border border-green-800">
                                            You have all the required parts to build this!
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                                            {comparison.missingList.map((p, i) => (
                                                <div key={i} className="bg-slate-800 p-2 rounded-xl border border-red-900 flex flex-col relative overflow-hidden">
                                                    <div className="absolute top-0 right-0 bg-red-600 text-white text-xs px-2 py-1 rounded-bl-lg font-bold z-10">
                                                        Missing {p.missing}
                                                    </div>
                                                    <div className="bg-white rounded p-1 mb-2 h-24 flex items-center justify-center">
                                                        <img src={p.img_url} className="max-h-full max-w-full object-contain" alt={p.name} />
                                                    </div>
                                                    <div className="text-xs text-slate-400 font-mono">{p.part_num}</div>
                                                    <div className="text-xs font-semibold leading-tight flex-grow mb-1" title={p.name}>{p.name}</div>
                                                    <div className="text-xs flex justify-between mt-auto">
                                                        <span className="text-slate-500 truncate mr-2" title={p.color_name}>{p.color_name}</span>
                                                        <span className="text-slate-300">Have {p.available}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <h3 className="text-xl font-bold text-green-400 mb-4 flex items-center">
                                        Sufficient Parts <span className="ml-2 bg-green-900/50 text-green-300 text-sm px-2 py-1 rounded-full">{comparison.sufficientList.length} Lots</span>
                                    </h3>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 opacity-75">
                                        {comparison.sufficientList.map((p, i) => (
                                            <div key={i} className="bg-slate-800 p-2 rounded-xl border border-slate-700 flex flex-col">
                                                <div className="bg-white rounded p-1 mb-2 h-24 flex items-center justify-center relative">
                                                     <div className="absolute top-1 right-1 bg-green-600 text-white text-[10px] px-1.5 py-0.5 rounded shadow">
                                                        Need {p.required}
                                                    </div>
                                                    <img src={p.img_url} className="max-h-full max-w-full object-contain" alt={p.name} />
                                                </div>
                                                <div className="text-xs text-slate-400 font-mono">{p.part_num}</div>
                                                <div className="text-xs font-semibold flex-grow mb-1 line-clamp-1">{p.name}</div>
                                                <div className="text-xs text-slate-500">Have {p.available} (Surplus: {p.available - p.required})</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
                        <div className="container mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-lego-yellow text-slate-900 p-2 rounded-lg font-black text-xl tracking-tighter transform -skew-x-12">
                                    TECH<span className="text-lego-red">INV</span>
                                </div>
                                <h1 className="text-xl font-bold hidden sm:block">Technic Parts Calculator</h1>
                            </div>
                            
                            <nav className="flex space-x-1 bg-slate-800 p-1 rounded-lg">
                                <button onClick={() => setActiveTab('inventory')} className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'inventory' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>Inventory</button>
                                <button onClick={() => setActiveTab('sets')} className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'sets' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>Collection ({sets.length})</button>
                                <button onClick={() => setActiveTab('moc')} className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'moc' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>Compare MOC</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'settings' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                    <Icon name="settings" className="w-5 h-5" />
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow container mx-auto px-4 py-8">
                        {errorMsg && (
                            <div className="bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 flex items-center justify-between">
                                <span>{errorMsg}</span>
                                <button onClick={() => setErrorMsg('')} className="text-red-400 hover:text-red-100"><Icon name="x" className="w-4 h-4"/></button>
                            </div>
                        )}

                        {activeTab === 'inventory' && <InventoryView />}
                        {activeTab === 'sets' && <CollectionView />}
                        {activeTab === 'moc' && <MocView />}
                        
                        {activeTab === 'settings' && (
                            <div className="max-w-2xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg mt-8">
                                <h2 className="text-xl font-bold mb-4">Settings</h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-400 mb-1">Rebrickable API Key</label>
                                        <input 
                                            type="text" 
                                            value={apiKey} 
                                            onChange={(e) => setApiKey(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-lego-blue"
                                            placeholder="Enter your API key..."
                                        />
                                        <p className="text-xs text-slate-500 mt-2">
                                            Required to fetch set inventories. Get one for free at <a href="https://rebrickable.com/api/" target="_blank" className="text-lego-blue hover:underline">rebrickable.com</a>. Saved locally in your browser.
                                        </p>
                                    </div>
                                    <div className="pt-4 border-t border-slate-700 mt-4">
                                        <button 
                                            onClick={() => {
                                                if (confirm('Are you sure? This will delete your entire collection and cached data locally.')) {
                                                    setSets([]);
                                                    localStorage.removeItem('legoSets');
                                                    setActiveTab('inventory');
                                                }
                                            }}
                                            className="px-4 py-2 bg-red-900/30 text-red-500 border border-red-900/50 rounded-lg hover:bg-red-900/50 transition-colors text-sm font-medium"
                                        >
                                            Clear All Local Data
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Part Detail Modal */}
                    {selectedPart && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden animate-fade-in">
                                <div className="flex justify-between items-start p-4 border-b border-slate-700">
                                    <h3 className="text-lg font-bold pr-8">{selectedPart.name}</h3>
                                    <button onClick={() => setSelectedPart(null)} className="text-slate-400 hover:text-white bg-slate-700 p-1 rounded-full"><Icon name="x" className="w-5 h-5"/></button>
                                </div>
                                <div className="p-6 flex flex-col md:flex-row gap-6">
                                    <div className="w-full md:w-1/3 flex flex-col gap-4">
                                        <div className="bg-white rounded-xl p-2 flex items-center justify-center shadow-inner h-40">
                                            <img src={selectedPart.img_url} className="max-h-full object-contain" alt={selectedPart.name} />
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-700">
                                            <div className="text-xs text-slate-400 mb-1">Total Owned</div>
                                            <div className="text-3xl font-black text-lego-yellow">{selectedPart.total_qty}</div>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-2/3">
                                        <div className="grid grid-cols-2 gap-y-2 gap-x-4 mb-4 text-sm">
                                            <div className="text-slate-400">Design ID:</div>
                                            <div className="font-mono text-white">{selectedPart.part_num}</div>
                                            <div className="text-slate-400">Color:</div>
                                            <div className="text-white">{selectedPart.color_name}</div>
                                            {selectedPart.element_id && (
                                                <>
                                                    <div className="text-slate-400">Element ID:</div>
                                                    <div className="font-mono text-white">{selectedPart.element_id}</div>
                                                </>
                                            )}
                                        </div>
                                        
                                        <div className="mt-4">
                                            <h4 className="text-sm font-bold text-slate-300 mb-2 border-b border-slate-700 pb-1">Set Breakdown</h4>
                                            <div className="max-h-48 overflow-y-auto custom-scroll pr-2 space-y-2">
                                                {selectedPart.provenance.map((prov, idx) => (
                                                    <div key={idx} className="flex justify-between items-center bg-slate-900/50 p-2 rounded border border-slate-700/50 text-sm">
                                                        <div className="truncate pr-2">
                                                            <span className="font-mono text-slate-400 mr-2">{prov.set_num}</span>
                                                            <span className="text-slate-200">{prov.name}</span>
                                                        </div>
                                                        <div className="font-bold whitespace-nowrap bg-slate-800 px-2 py-0.5 rounded text-lego-yellow">
                                                            x{prov.qty}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
